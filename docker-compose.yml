# Local development stack. Run: docker compose up -d, then: uv run alembic upgrade head
services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    # Docker's default /dev/shm is 64 MB; parallel index builds (HNSW) need far more.
    shm_size: 2gb
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CC_DB_PASSWORD:-catalog}
      POSTGRES_DB: catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
